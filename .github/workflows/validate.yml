name: Validate Plutus
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plutus_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: plutus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plutus_test -d plutus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://plutus_test:ci-test-only-password@127.0.0.1:5432/plutus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend and backend
        run: npm run build
      - name: Apply test database schema
        run: npm run db:migrate
      - name: Real PostgreSQL API integration
        run: npm run test:api
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser E2E (mock API)
        run: npm run test:e2e
      - name: Desktop and mobile browser E2E (real PostgreSQL)
        run: npm run test:e2e:live
